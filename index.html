<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KFC - Finger Lickin' Good</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #FF0000 0%, #FF4500 50%, #FF8C00 100%);
    }

    #canvas-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    .content {
      position: relative;
      z-index: 10;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: white;
      text-align: center;
      padding: 20px;
      background: rgba(0, 0, 0, 0.4);
    }

    .logo {
      font-size: 4rem;
      font-weight: bold;
      margin-bottom: 20px;
      text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.7);
      animation: fadeInDown 1s ease-out;
    }

    .tagline {
      font-size: 2rem;
      margin-bottom: 30px;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.7);
      animation: fadeIn 1.5s ease-out;
    }

    .cta-button {
      padding: 15px 40px;
      font-size: 1.2rem;
      font-weight: bold;
      background: #FF0000;
      color: white;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(255, 0, 0, 0.4);
      animation: fadeInUp 2s ease-out;
    }

    .cta-button:hover {
      background: #CC0000;
      transform: translateY(-3px);
      box-shadow: 0 6px 20px rgba(255, 0, 0, 0.6);
    }

    .menu-preview {
      display: flex;
      gap: 30px;
      margin-top: 50px;
      animation: fadeIn 2.5s ease-out;
    }

    .menu-item {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 15px;
      padding: 20px;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      transition: transform 0.3s ease;
    }

    .menu-item:hover {
      transform: translateY(-10px);
    }

    .menu-item img {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 10px;
    }

    .menu-item h3 {
      font-size: 1.2rem;
      margin-bottom: 5px;
    }

    .menu-item p {
      font-size: 0.9rem;
      opacity: 0.8;
    }

    .stats {
      display: flex;
      justify-content: center;
      gap: 50px;
      margin-top: 50px;
      animation: fadeIn 3s ease-out;
    }

    .stat {
      text-align: center;
    }

    .stat-number {
      font-size: 2.5rem;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .stat-label {
      font-size: 1rem;
      opacity: 0.9;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes fadeInDown {
      from {
        opacity: 0;
        transform: translateY(-30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .floating-text {
      position: absolute;
      font-size: 0.8rem;
      opacity: 0.7;
      animation: float 6s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-20px); }
    }

    .loading {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #FF0000;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      transition: opacity 0.5s ease;
    }

    .loading.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .loader {
      width: 50px;
      height: 50px;
      border: 5px solid rgba(255, 255, 255, 0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="loading" id="loading">
    <div class="loader"></div>
  </div>

  <div id="canvas-container"></div>

  <div class="content">
    <div class="logo">KFC</div>
    <div class="tagline">Finger Lickin' Good</div>
    <button class="cta-button" onclick="orderNow()">ORDER NOW</button>

    <div class="menu-preview">
      <div class="menu-item">
        <div style="width: 100px; height: 100px; background: linear-gradient(45deg, #FFD700, #FFA500); border-radius: 50%; margin: 0 auto 10px;"></div>
        <h3>Original Recipe</h3>
        <p>11 Herbs & Spices</p>
      </div>
      <div class="menu-item">
        <div style="width: 100px; height: 100px; background: linear-gradient(45deg, #FF6347, #FF4500); border-radius: 50%; margin: 0 auto 10px;"></div>
        <h3>Hot Wings</h3>
        <p>Spicy & Crispy</p>
      </div>
      <div class="menu-item">
        <div style="width: 100px; height: 100px; background: linear-gradient(45deg, #FFD700, #FF8C00); border-radius: 50%; margin: 0 auto 10px;"></div>
        <h3>Zinger Burger</h3>
        <p>Signature Spicy</p>
      </div>
    </div>

    <div class="stats">
      <div class="stat">
        <div class="stat-number">120+</div>
        <div class="stat-label">Countries</div>
      </div>
      <div class="stat">
        <div class="stat-number">20K+</div>
        <div class="stat-label">Restaurants</div>
      </div>
      <div class="stat">
        <div class="stat-number">1930</div>
        <div class="stat-label">Founded</div>
      </div>
    </div>

    <div class="floating-text" style="top: 10%; left: 5%;">It's Finger Lickin' Good!</div>
    <div class="floating-text" style="top: 20%; right: 5%;">Try Our New Menu!</div>
    <div class="floating-text" style="bottom: 10%; left: 10%;">Secret Recipe</div>
    <div class="floating-text" style="bottom: 20%; right: 10%;">Since 1930</div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    // Scene setup
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
    
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.getElementById('canvas-container').appendChild(renderer.domElement);

    // Lighting
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
    scene.add(ambientLight);

    const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
    directionalLight.position.set(1, 1, 1);
    scene.add(directionalLight);

    const pointLight = new THREE.PointLight(0xff0000, 1, 100);
    pointLight.position.set(0, 0, 0);
    scene.add(pointLight);

    // Create floating chicken pieces
    const chickenGroup = new THREE.Group();
    scene.add(chickenGroup);

    function createChickenPiece() {
      const geometry = new THREE.DodecahedronGeometry(0.5, 0);
      const material = new THREE.MeshPhongMaterial({
        color: 0xFFD700,
        shininess: 100,
        specular: 0xFFD700
      });
      const mesh = new THREE.Mesh(geometry, material);
      
      // Add some texture variation
      const edges = new THREE.EdgesGeometry(geometry);
      const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0xFFA500, linewidth: 2 }));
      mesh.add(line);
      
      return mesh;
    }

    // Create multiple chicken pieces
    for (let i = 0; i < 15; i++) {
      const piece = createChickenPiece();
      piece.position.x = (Math.random() - 0.5) * 20;
      piece.position.y = (Math.random() - 0.5) * 20;
      piece.position.z = (Math.random() - 0.5) * 20;
      piece.rotation.x = Math.random() * Math.PI;
      piece.rotation.y = Math.random() * Math.PI;
      piece.userData = {
        rotationSpeed: {
          x: (Math.random() - 0.5) * 0.01,
          y: (Math.random() - 0.5) * 0.01,
          z: (Math.random() - 0.5) * 0.01
        },
        floatSpeed: Math.random() * 0.5 + 0.5,
        floatOffset: Math.random() * Math.PI * 2
      };
      chickenGroup.add(piece);
    }

    // Create KFC logo as 3D text
    function createLogo() {
      const fontLoader = new THREE.FontLoader();
      
      fontLoader.load('https://threejs.org/examples/fonts/helvetiker_regular.typeface.json', function(font) {
        const textGeometry = new THREE.TextGeometry('KFC', {
          font: font,
          size: 3,
          height: 0.5,
          curveSegments: 12,
          bevelEnabled: true,
          bevelThickness: 0.2,
          bevelSize: 0.2,
          bevelOffset: 0,
          bevelSegments: 5
        });
        
        const textMaterial = new THREE.MeshPhongMaterial({
          color: 0xFF0000,
          shininess: 100,
          specular: 0xFF0000
        });
        
        const textMesh = new THREE.Mesh(textGeometry, textMaterial);
        textMesh.position.z = -5;
        textMesh.position.y = 2;
        textMesh.rotation.x = -0.1;
        
        // Add glowing effect
        const glowMaterial = new THREE.MeshBasicMaterial({
          color: 0xFF4500,
          transparent: true,
          opacity: 0.3
        });
        const glowMesh = new THREE.Mesh(textGeometry, glowMaterial);
        glowMesh.position.copy(textMesh.position);
        glowMesh.rotation.copy(textMesh.rotation);
        glowMesh.scale.multiplyScalar(1.05);
        
        chickenGroup.add(textMesh);
        chickenGroup.add(glowMesh);
      });
    }

    createLogo();

    // Add particles for atmosphere
    const particlesGeometry = new THREE.BufferGeometry();
    const particlesCount = 500;
    const posArray = new Float32Array(particlesCount * 3);
    
    for (let i = 0; i < particlesCount * 3; i++) {
      posArray[i] = (Math.random() - 0.5) * 50;
    }
    
    particlesGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
    
    const particlesMaterial = new THREE.PointsMaterial({
      size: 0.1,
      color: 0xFFD700,
      transparent: true,
      opacity: 0.8
    });
    
    const particlesMesh = new THREE.Points(particlesGeometry, particlesMaterial);
    scene.add(particlesMesh);

    // Camera position
    camera.position.z = 10;
    camera.position.y = 5;
    camera.lookAt(0, 0, 0);

    // Animation
    function animate() {
      requestAnimationFrame(animate);
      
      // Rotate chicken group
      chickenGroup.rotation.y += 0.002;
      
      // Animate individual pieces
      chickenGroup.children.forEach(child => {
        if (child.userData && child.userData.rotationSpeed) {
          child.rotation.x += child.userData.rotationSpeed.x;
          child.rotation.y += child.userData.rotationSpeed.y;
          child.rotation.z += child.userData.rotationSpeed.z;
          
          // Float up and down
          child.position.y += Math.sin(Date.now() * 0.001 + child.userData.floatOffset) * 0.01 * child.userData.floatSpeed;
        }
      });
      
      // Rotate particles
      particlesMesh.rotation.y += 0.001;
      
      // Add subtle camera movement
      camera.position.x = Math.sin(Date.now() * 0.0005) * 2;
      camera.position.z = 10 + Math.cos(Date.now() * 0.0005) * 2;
      camera.lookAt(0, 0, 0);
      
      renderer.render(scene, camera);
    }

    // Handle window resize
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Hide loading screen after everything is ready
    window.addEventListener('load', () => {
      setTimeout(() => {
        document.getElementById('loading').classList.add('hidden');
        animate();
      }, 500);
    });

    // Order now function
    function orderNow() {
      alert('Redirecting to KFC ordering page...');
      // In a real implementation, this would redirect to the actual ordering page
      window.location.href = 'https://www.kfc.com';
    }

    // Start animation immediately
    animate();
  </script>
</body>
</html>
