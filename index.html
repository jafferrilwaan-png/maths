<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="data:,">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>AI Study Assistant</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2563eb">

  <link rel="stylesheet" href="vendor/katex/katex.min.css">
  <script defer src="vendor/katex/katex.min.js"></script>
  <script defer src="vendor/katex/auto-render.min.js"></script>
  <script src="ai_tutor.js?v=10.0"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; font-family: 'Plus Jakarta Sans', -apple-system, sans-serif; color: #0f172a; }
    body {
      background: linear-gradient(135deg, #0b1e42 0%, #1e3a8a 45%, #2563eb 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .ai-shell {
      width: 100%;
      max-width: 860px;
      height: calc(100vh - 32px);
      background: rgba(255, 255, 255, 0.96);
      border-radius: 16px;
      box-shadow: 0 24px 60px rgba(15, 23, 42, 0.35);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.8);
    }
    .ai-header {
      padding: 14px 18px;
      background: #f8fafc;
      border-bottom: 1px solid #e2e8f0;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .ai-title {
      font-size: 17px;
      font-weight: 800;
      color: #1e3a8a;
    }
    .ai-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }
    .ai-provider-select, .ai-model-select {
      padding: 7px 10px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      background: #ffffff;
      font-family: inherit;
      font-size: 12.5px;
      font-weight: 600;
      color: #0f172a;
      max-width: 260px;
    }
    .inline-ai-chat-history {
      flex: 1;
      overflow-y: auto;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: #ffffff;
    }
    .inline-ai-msg { display: flex; flex-direction: column; max-width: 88%; }
    .inline-ai-msg-user { align-self: flex-end; }
    .inline-ai-msg-bot { align-self: flex-start; }
    .inline-ai-bubble {
      padding: 11px 15px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.6;
      word-break: break-word;
    }
    .inline-ai-msg-user .inline-ai-bubble {
      background: #2563eb;
      color: #ffffff;
      border-bottom-right-radius: 4px;
    }
    .inline-ai-msg-bot .inline-ai-bubble {
      background: #f1f5f9;
      color: #0f172a;
      border: 1px solid #e2e8f0;
      border-bottom-left-radius: 4px;
    }
    .ai-reasoning {
      margin-bottom: 8px;
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 12.5px;
    }
    .ai-reasoning-summary { cursor: pointer; font-weight: 700; color: #475569; }
    .ai-reasoning-body { margin-top: 6px; color: #475569; }
    .ai-table-wrap { overflow-x: auto; margin: 8px 0; }
    .ai-table { border-collapse: collapse; width: 100%; font-size: 13px; }
    .ai-table th, .ai-table td { border: 1px solid #cbd5e1; padding: 6px 8px; text-align: left; }
    .ai-table th { background: #e2e8f0; }
    .ai-ul, .ai-ol { margin: 6px 0 6px 20px; }
    .ai-input-bar {
      padding: 12px 16px;
      background: #f8fafc;
      border-top: 1px solid #e2e8f0;
      display: flex;
      gap: 10px;
    }
    .inline-ai-input {
      flex: 1;
      padding: 11px 14px;
      border: 1.5px solid #cbd5e1;
      border-radius: 10px;
      font-family: inherit;
      font-size: 14px;
      outline: none;
    }
    .inline-ai-input:focus { border-color: #2563eb; }
    .inline-ai-send-btn {
      padding: 0 20px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: #ffffff;
      font-family: inherit;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }
    .inline-ai-send-btn:hover { background: #1d4ed8; }
    .ai-typing-dots span { animation: blink 1.2s infinite; }
    .ai-typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .ai-typing-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes blink { 0%, 80%, 100% { opacity: 0.2; } 40% { opacity: 1; } }
  </style>
</head>
<body>
  <main class="ai-shell inline-ai-section">
    <header class="ai-header">
      <div class="ai-title">AI Assistant</div>
      <div class="ai-controls">
        <select class="ai-provider-select" onchange="AITutor.setProvider(this.value)" aria-label="AI Provider">
          <option value="gemini">Google Gemini</option>
          <option value="openrouter">OpenRouter Free</option>
        </select>
        <select class="ai-model-select" onchange="AITutor.setModel(this.value)" aria-label="AI Model"></select>
      </div>
    </header>

    <div class="inline-ai-chat-history">
      <div class="inline-ai-msg inline-ai-msg-bot">
        <div class="inline-ai-bubble">Ask anything — step-by-step explanations, equations, or concepts.</div>
      </div>
    </div>

    <div class="ai-input-bar">
      <input type="text" class="inline-ai-input" placeholder="Ask a question..." onkeypress="AITutor.handleKey(event, this)">
      <button type="button" class="inline-ai-send-btn" onclick="AITutor.askInline(this)">Send</button>
    </div>
  </main>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js?v=10.0').then((reg) => reg.update()).catch(() => {});
      });
    }
  </script>
</body>
</html>
