<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>23MA1302 • Linear Algebra &amp; Numerical Analysis Master App</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- KaTeX CSS and JS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

  <!-- Unit Data & AI Tutor Scripts -->
  <script src="unit1_data.js"></script>
  <script src="unit2_data.js"></script>
  <script src="unit3_data.js"></script>
  <script src="ai_tutor.js"></script>

  <style>
    :root {
      --bg-base: #e6f0fa;
      --card-bg: #f8fafc;
      --card-clay: #f0f7ff;
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --primary-light: #60a5fa;
      --text-main: #0f172a;
      --text-muted: #475569;
      --border-clay: rgba(255, 255, 255, 0.85);
      --shadow-light: #ffffff;
      --shadow-dark: #cad8e8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #e2edfa;
      background-attachment: fixed;
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      color: var(--text-main);
      line-height: 1.6;
      min-height: 100vh;
      padding-bottom: 80px;
      overflow-x: hidden;
    }

    /* Fluid Physics Gas Canvas */
    #gas-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: -1;
      pointer-events: none;
    }

    /* Sticky Glass Header */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      background: rgba(240, 247, 255, 0.85);
      border-bottom: 1px solid rgba(255, 255, 255, 0.9);
      box-shadow: 0 6px 20px rgba(191, 207, 226, 0.35);
    }

    

    /* Unit Switcher Tabs */
    .unit-switcher {
      display: flex;
      background: #e2ecf7;
      padding: 4px;
      border-radius: 999px;
      box-shadow: inset 4px 4px 8px #cad8e8, inset -4px -4px 8px #ffffff;
      gap: 4px;
      overflow-x: auto;
      max-width: 100%;
      scrollbar-width: none;
    }
    .unit-switcher::-webkit-scrollbar { display: none; }

    .unit-btn {
      border: none;
      background: transparent;
      padding: 8px 18px;
      border-radius: 999px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 700;
      color: var(--text-muted);
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.25s ease;
    }

    .unit-btn.active {
      background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
      color: #ffffff;
      box-shadow: 4px 4px 12px rgba(37, 99, 235, 0.35), inset 1px 1px 2px rgba(255, 255, 255, 0.5);
    }

    /* Part A / Part B Switcher */
    .tab-switcher {
      display: flex;
      background: #e2ecf7;
      padding: 4px;
      border-radius: 999px;
      box-shadow: inset 4px 4px 8px #cad8e8, inset -4px -4px 8px #ffffff;
      gap: 4px;
    }

    .tab-btn {
      border: none;
      background: transparent;
      padding: 8px 22px;
      border-radius: 999px;
      font-family: inherit;
      font-size: 13.5px;
      font-weight: 700;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .tab-btn.active {
      background: linear-gradient(135deg, #ffffff 0%, #f0f7ff 100%);
      color: var(--primary-dark);
      box-shadow: 4px 4px 10px rgba(186, 204, 226, 0.5), -2px -2px 6px #ffffff;
    }

    

    /* Hero Banner */
    .hero-banner {
      background: linear-gradient(135deg, rgba(30, 58, 138, 0.92) 0%, rgba(37, 99, 235, 0.9) 55%, rgba(59, 130, 246, 0.88) 100%);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-radius: 24px;
      padding: 24px 28px;
      color: white;
      margin-bottom: 22px;
      box-shadow: 14px 14px 32px rgba(37, 99, 235, 0.3), inset 1px 1px 2px rgba(255, 255, 255, 0.6);
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.25);
    }

    .hero-tag {
      display: inline-block;
      background: rgba(255, 255, 255, 0.22);
      backdrop-filter: blur(8px);
      padding: 4px 14px;
      border-radius: 999px;
      font-size: 11.5px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .hero-banner h2 {
      font-size: 22px;
      font-weight: 800;
      margin-bottom: 6px;
      letter-spacing: -0.4px;
    }

    .hero-banner p {
      font-size: 13.5px;
      opacity: 0.95;
      max-width: 750px;
    }

    /* Filter Bar */
    .filter-bar {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 20px;
      scrollbar-width: none;
    }
    .filter-bar::-webkit-scrollbar { display: none; }

    .chip {
      background: rgba(255, 255, 255, 0.8);
      border: 1px solid var(--border-clay);
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      box-shadow: 4px 4px 10px #cad8e8, -4px -4px 10px #ffffff;
      white-space: nowrap;
      transition: all 0.2s ease;
    }

    .chip.active, .chip:hover {
      color: var(--primary-dark);
      background: #ffffff;
      box-shadow: inset 2px 2px 5px #cad8e8, inset -2px -2px 5px #ffffff;
    }

    .section-badge {
      font-size: 14px;
      font-weight: 800;
      color: var(--primary-dark);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin: 20px 0 14px 6px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Question Cards */
    .question-card {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      border: 1px solid rgba(255, 255, 255, 0.95);
      border-radius: 20px;
      padding: 22px 24px;
      margin-bottom: 22px;
      box-shadow: 14px 14px 30px rgba(150, 178, 208, 0.45), -12px -12px 28px rgba(255, 255, 255, 0.95);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .question-card:hover {
      box-shadow: 18px 18px 36px rgba(140, 170, 205, 0.55), -14px -14px 32px #ffffff;
      transform: translateY(-2px);
    }

    .card-top {
      margin-bottom: 14px;
    }

    .q-pill {
      display: inline-block;
      background: linear-gradient(135deg, #dbeafe 0%, #bfdbfe 100%);
      color: var(--primary-dark);
      font-size: 12px;
      font-weight: 800;
      padding: 4px 12px;
      border-radius: 8px;
      margin-bottom: 10px;
      box-shadow: inset 1px 1px 2px rgba(255,255,255,0.8), 2px 2px 6px rgba(191, 219, 254, 0.5);
    }

    .q-heading {
      font-size: 15.5px;
      font-weight: 700;
      color: #0f172a;
      line-height: 1.5;
    }

    .solution-content {
      font-size: 14px;
      color: #334155;
      line-height: 1.65;
    }

    .partb-step {
      background: rgba(255, 255, 255, 0.7);
      border: 1px solid rgba(219, 234, 254, 0.8);
      border-radius: 14px;
      padding: 14px 18px;
      margin-top: 14px;
    }

    .step-title {
      font-weight: 800;
      color: #1e3a8a;
      margin-bottom: 6px;
      font-size: 14.5px;
    }

    .tag-result {
      display: inline-block;
      background: #ecfdf5;
      color: #065f46;
      font-weight: 700;
      padding: 5px 14px;
      border-radius: 10px;
      border: 1px solid #a7f3d0;
      margin-top: 10px;
      box-shadow: 2px 2px 6px #d0e4da;
      font-size: 13px;
    }

    .tag-result.fail {
      background: #fef2f2;
      color: #b91c1c;
      border-color: #fecaca;
      box-shadow: 2px 2px 6px #f2dcdc;
    }

    /* Interactive Line-by-Line Breakdown Accordion */
    .why-dropdown {
      margin-top: 16px;
      border-radius: 16px;
      background: linear-gradient(135deg, rgba(239, 246, 255, 0.95) 0%, rgba(219, 234, 254, 0.85) 100%);
      border: 1px solid rgba(147, 197, 253, 0.85);
      overflow: hidden;
      box-shadow: 4px 4px 14px rgba(186, 215, 248, 0.4), -2px -2px 10px #ffffff;
      transition: all 0.3s ease;
    }

    .why-toggle-btn:focus, .why-toggle-btn:focus-visible {
      outline: none !important;
      box-shadow: none !important;
    }
    .why-toggle-btn {
      width: 100%;
      background: transparent;
      border: none;
      padding: 12px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: inherit;
      font-size: 13.5px;
      font-weight: 700;
      color: #1d4ed8;
      cursor: pointer;
      user-select: none;
      transition: background 0.2s ease;
    }

    .why-toggle-btn:hover {
      background: rgba(255, 255, 255, 0.6);
    }

    .why-icon {
      transition: transform 0.3s ease;
      font-size: 13px;
      color: #2563eb;
    }

    .why-content {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.4s ease-in-out, padding 0.3s ease;
      padding: 0 18px;
      font-size: 13.5px;
      color: #1e293b;
      line-height: 1.6;
    }

    .why-dropdown.open .why-content {
      max-height: 2500px;
      padding: 6px 18px 18px;
    }

    .why-dropdown.open .why-icon {
      transform: rotate(180deg);
    }

    .explain-intro {
      font-weight: 700;
      font-size: 12.5px;
      color: #1e40af;
      margin: 4px 0 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .explain-line {
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid rgba(191, 219, 254, 0.9);
      border-radius: 12px;
      padding: 11px 15px;
      margin-top: 10px;
      box-shadow: 2px 2px 8px rgba(186, 215, 248, 0.35);
    }

    .explain-line-badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 2px 8px;
      border-radius: 6px;
      background: #dbeafe;
      color: #1e40af;
      margin-bottom: 5px;
    }

    .explain-line-title {
      font-weight: 700;
      color: #0f172a;
      font-size: 13.5px;
      margin-bottom: 3px;
    }

    .explain-line-desc {
      color: #334155;
      font-size: 13px;
      line-height: 1.55;
    }

    
    /* Inline AI Matrix Dot UI inside Dropdown */
    .inline-ai-section {
      margin-top: 18px;
      border-radius: 14px;
      background-color: #f8fafc;
      background-image: radial-gradient(#94a3b8 1px, transparent 1px);
      background-size: 14px 14px;
      border: 1px solid #cbd5e1;
      box-shadow: inset 2px 2px 5px rgba(203, 213, 225, 0.4), inset -2px -2px 5px #ffffff;
      padding: 16px;
    }

    .inline-ai-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      gap: 12px;
      flex-wrap: wrap;
    }

    .inline-ai-title-wrap {
      display: flex;
      flex-direction: column;
    }

    .inline-ai-title {
      font-size: 13.5px;
      font-weight: 800;
      color: #0f172a;
      letter-spacing: -0.2px;
    }

    .inline-ai-desc {
      font-size: 11.5px;
      color: #64748b;
      font-weight: 500;
    }

    .inline-ai-model-select {
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      padding: 5px 10px;
      font-family: inherit;
      font-size: 12px;
      color: #1e293b;
      font-weight: 600;
      box-shadow: 1px 1px 3px rgba(0,0,0,0.05);
      outline: none;
    }

    .inline-ai-chat-history {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 350px;
      overflow-y: auto;
      margin-bottom: 12px;
    }

    .inline-ai-msg {
      display: flex;
      flex-direction: column;
    }

    .inline-ai-msg-user {
      align-items: flex-end;
    }

    .inline-ai-msg-bot {
      align-items: flex-start;
    }

    .inline-ai-bubble {
      max-width: 90%;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 13px;
      line-height: 1.6;
    }

    .inline-ai-msg-user .inline-ai-bubble {
      background: #2563eb;
      color: #ffffff;
      border-bottom-right-radius: 2px;
    }

    .inline-ai-msg-bot .inline-ai-bubble {
      background: #ffffff;
      color: #1e293b;
      border: 1px solid #e2e8f0;
      border-bottom-left-radius: 2px;
      box-shadow: 2px 2px 6px rgba(0, 0, 0, 0.04);
    }

    .inline-ai-input-group {
      display: flex;
      gap: 8px;
    }

    .inline-ai-input {
      flex: 1;
      padding: 9px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-family: inherit;
      font-size: 13px;
      background: #ffffff;
      color: #0f172a;
      outline: none;
      box-shadow: inset 1px 1px 2px rgba(0,0,0,0.05);
    }

    .inline-ai-input:focus {
      border-color: #2563eb;
    }

    .inline-ai-send-btn {
      background: #2563eb;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      padding: 0 16px;
      font-family: inherit;
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .inline-ai-send-btn:hover {
      background: #1d4ed8;
    }


    .inline-ai-controls {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .inline-ai-provider-select, .inline-ai-model-select {
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      padding: 5px 10px;
      font-family: inherit;
      font-size: 12px;
      color: #1e293b;
      font-weight: 600;
      box-shadow: 1px 1px 3px rgba(0,0,0,0.05);
      outline: none;
    }

    .inline-ai-provider-select:focus, .inline-ai-model-select:focus {
      border-color: #2563eb;
    }


    /* Responsive Auto-Adjust Fluid Layout */
    main {
      width: 100%;
      max-width: 1100px;
      margin: 14px auto 0;
      padding: 0 16px 70px;
      box-sizing: border-box;
    }

    .nav-container {
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      padding: 10px 16px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: center;
    }

    .header-sub-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      width: 100%;
    }

    .question-card {
      width: 100%;
      max-width: 100%;
      box-sizing: border-box;
      background: rgba(255, 255, 255, 0.90);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.95);
      border-radius: 18px;
      padding: 20px 24px;
      margin-bottom: 18px;
      box-shadow: 6px 6px 20px rgba(160, 185, 215, 0.32), -4px -4px 16px rgba(255, 255, 255, 0.9);
      word-break: break-word;
      overflow-wrap: break-word;
    }

    .question-card:hover {
      box-shadow: 10px 10px 28px rgba(150, 178, 210, 0.42), -6px -6px 20px #ffffff;
      transform: translateY(-2px);
    }

    .q-heading {
      font-size: 15.5px;
      font-weight: 700;
      color: #0f172a;
      line-height: 1.5;
      word-break: break-word;
      overflow-wrap: break-word;
    }

    .solution-content {
      font-size: 14px;
      color: #334155;
      line-height: 1.65;
      word-break: break-word;
      overflow-wrap: break-word;
    }

    .katex-display {
      max-width: 100%;
      overflow-x: auto;
      overflow-y: hidden;
      padding: 6px 0;
      scrollbar-width: thin;
      -webkit-overflow-scrolling: touch;
      margin: 8px 0;
    }

    @media (max-width: 768px) {
      body {
        padding-bottom: 40px;
      }
      main {
        width: 100%;
        max-width: 100%;
        margin: 8px 0 0 0;
        padding: 0 8px 40px;
      }
      .nav-container {
        width: 100%;
        max-width: 100%;
        padding: 8px 8px;
      }
      .question-card {
        padding: 14px 14px;
        border-radius: 14px;
        margin-bottom: 12px;
      }
      .hero-banner {
        padding: 18px 16px;
        border-radius: 16px;
        margin-bottom: 14px;
      }
      .unit-btn {
        padding: 6px 12px;
        font-size: 12px;
      }
      .tab-btn {
        padding: 6px 16px;
        font-size: 12.5px;
      }
      .inline-ai-section {
        padding: 12px;
      }
      .inline-ai-header {
        flex-direction: column;
        align-items: flex-start;
      }
    }

</style>
</head>
<body>
  <!-- Real-world Physics Moving Gas Canvas -->
  <canvas id="gas-canvas"></canvas>

  <!-- Sticky Glass Navigation -->
  <header>
    <div class="nav-container">
      <!-- Unit Tabs -->
      <div class="unit-switcher">
        <button class="unit-btn active" id="unitBtn1" onclick="switchUnit(1)">Unit I: Vector Spaces</button>
        <button class="unit-btn" id="unitBtn2" onclick="switchUnit(2)">Unit II: Linear Transformations</button>
        <button class="unit-btn" id="unitBtn3" onclick="switchUnit(3)">Unit III: Inner Product Spaces</button>
      </div>

      <div class="header-sub-row">
        <!-- Part A / Part B Tabs -->
        <div class="tab-switcher">
          <button class="tab-btn active" id="tabPartA" onclick="switchTab('partA')">Part A (2-Mark)</button>
          <button class="tab-btn" id="tabPartB" onclick="switchTab('partB')">Part B (16-Mark)</button>
        </div>

        <!-- Automatic Layout Size Adjuster -->
        
      </div>
    </div>
  </header>

  <main>
    <!-- Hero Banner -->
    <div class="hero-banner">
      <div class="hero-tag" id="bannerTag">Unit-I: Vector Spaces</div>
      <h2 id="bannerTitle">Part A: Compulsory &amp; Extra High-Yield 2-Marks</h2>
      <p id="bannerDesc">Complete Question Bank + Class Notes derivations with interactive step dropdowns and KaTeX math.</p>
    </div>

        <!-- Filter Bar -->
    <div class="filter-bar">
      <button class="chip active" data-filter="all" onclick="filterCards('all', this)">All Questions</button>
      <button class="chip" data-filter="qb" onclick="filterCards('qb', this)">Question Bank (QB)</button>
      <button class="chip" data-filter="extra" onclick="filterCards('extra', this)">Extra High-Yield</button>
      <button class="chip" data-filter="16m" onclick="filterCards('16m', this)">Complete 16-Mark Derivations</button>
    </div>

    <!-- Active Unit Container -->
    <div id="unitContentArea">
      <div id="sectionPartA"></div>
      <div id="sectionPartB" style="display: none;"></div>
    </div>
  </main>

  <script>
    let currentUnit = 1;
    let currentTab = 'partA';

    function getUnitData(unitNum) {
      if (unitNum === 1) return window.UNIT1_DATA;
      if (unitNum === 2) return window.UNIT2_DATA;
      if (unitNum === 3) return window.UNIT3_DATA;
      return window.UNIT1_DATA;
    }

    function switchUnit(unitNum) {
      currentUnit = unitNum;
      document.querySelectorAll('.unit-btn').forEach((b, idx) => {
        b.classList.toggle('active', (idx + 1) === unitNum);
      });

      const data = getUnitData(unitNum);
      document.getElementById('bannerTag').textContent = data.title;
      document.getElementById('bannerTitle').textContent = (currentTab === 'partA' ? 'Part A: 2-Mark Questions' : 'Part B: Complete 16-Mark Questions');
      document.getElementById('bannerDesc').textContent = data.desc;

      document.getElementById('sectionPartA').innerHTML = data.partA;
      document.getElementById('sectionPartB').innerHTML = data.partB;

      // Render math
      resetFilter(); renderKaTeX();
    }

    
    function setLayoutWidth(mode) {
      document.body.classList.remove('layout-compact', 'layout-auto', 'layout-wide', 'layout-full');
      document.body.classList.add('layout-' + mode);
      localStorage.setItem('lana_layout_width', mode);

      document.querySelectorAll('.size-btn').forEach(btn => btn.classList.remove('active'));
      const activeBtn = document.getElementById('size' + mode.charAt(0).toUpperCase() + mode.slice(1));
      if (activeBtn) activeBtn.classList.add('active');
    }

    // Restore saved layout width or default to auto
    (function initLayoutWidth() {
      const saved = localStorage.getItem('lana_layout_width') || 'auto';
      setLayoutWidth(saved);
    })();

    function switchTab(tab) {
      currentTab = tab;
      document.getElementById('tabPartA').classList.toggle('active', tab === 'partA');
      document.getElementById('tabPartB').classList.toggle('active', tab === 'partB');

      document.getElementById('sectionPartA').style.display = (tab === 'partA' ? 'block' : 'none');
      document.getElementById('sectionPartB').style.display = (tab === 'partB' ? 'block' : 'none');

      const data = getUnitData(currentUnit);
      document.getElementById('bannerTitle').textContent = (tab === 'partA' ? 'Part A: 2-Mark Questions' : 'Part B: Complete 16-Mark Questions');
    }

    function toggleWhy(btn) {
      const dropdown = btn.closest('.why-dropdown');
      dropdown.classList.toggle('open');
    }

        function filterCards(category, btn) {
      document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
      if (btn) btn.classList.add('active');

      const visibleArea = (currentTab === 'partA' ? document.getElementById('sectionPartA') : document.getElementById('sectionPartB'));
      const cards = visibleArea.querySelectorAll('.question-card');

      cards.forEach(card => {
        const pillText = (card.querySelector('.q-pill')?.textContent || '').toLowerCase();
        const headingText = (card.querySelector('.q-heading')?.textContent || '').toLowerCase();

        if (category === 'all') {
          card.style.display = 'block';
        } else if (category === 'qb') {
          card.style.display = (pillText.includes('qb') ? 'block' : 'none');
        } else if (category === 'extra') {
          card.style.display = (pillText.includes('extra') ? 'block' : 'none');
        } else if (category === '16m') {
          card.style.display = (pillText.includes('16 mark') || currentTab === 'partB' ? 'block' : 'none');
        } else {
          card.style.display = 'block';
        }
      });
    }

    function resetFilter() {
      document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
      const allBtn = document.querySelector('.chip[data-filter="all"]');
      if (allBtn) allBtn.classList.add('active');
      document.querySelectorAll('.question-card').forEach(card => card.style.display = 'block');
    }

    function renderKaTeX() {
      if (window.renderMathInElement) {
        renderMathInElement(document.getElementById('unitContentArea'), {
          delimiters: [
            { left: '$$', right: '$$', display: true },
            { left: '$', right: '$', display: false }
          ],
          throwOnError: false
        });
      }
    }

    // Initialize with Unit 1 on load
    document.addEventListener('DOMContentLoaded', () => {
      switchUnit(1);
      setTimeout(renderKaTeX, 300);
    });
  </script>

  <!-- Fluid Physics Gas Animation Script -->
  <script>
    (function initGasPhysics() {
      const canvas = document.getElementById('gas-canvas');
      const ctx = canvas.getContext('2d');

      let width, height;
      function resize() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
      }
      window.addEventListener('resize', resize);
      resize();

      const numParticles = 48;
      const particles = [];
      const colors = [
        'rgba(255, 255, 255, 0.45)',
        'rgba(219, 234, 254, 0.55)',
        'rgba(191, 219, 254, 0.45)',
        'rgba(147, 197, 253, 0.35)',
        'rgba(96, 165, 250, 0.25)'
      ];

      for (let i = 0; i < numParticles; i++) {
        particles.push({
          x: Math.random() * width,
          y: Math.random() * height,
          vx: (Math.random() - 0.5) * 0.7,
          vy: (Math.random() - 0.5) * 0.7,
          radius: Math.random() * 120 + 80,
          color: colors[Math.floor(Math.random() * colors.length)],
          phase: Math.random() * Math.PI * 2
        });
      }

      let pointerX = width / 2;
      let pointerY = height / 2;
      window.addEventListener('mousemove', (e) => {
        pointerX = e.clientX;
        pointerY = e.clientY;
      });
      window.addEventListener('touchmove', (e) => {
        if (e.touches.length > 0) {
          pointerX = e.touches[0].clientX;
          pointerY = e.touches[0].clientY;
        }
      });

      function animate() {
        ctx.fillStyle = '#e2edfa';
        ctx.fillRect(0, 0, width, height);

        for (let p of particles) {
          p.phase += 0.008;
          p.x += p.vx + Math.cos(p.phase) * 0.3;
          p.y += p.vy + Math.sin(p.phase) * 0.3;

          const dx = pointerX - p.x;
          const dy = pointerY - p.y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < 260) {
            const force = (260 - dist) / 260;
            p.x -= (dx / dist) * force * 1.5;
            p.y -= (dy / dist) * force * 1.5;
          }

          if (p.x < -p.radius) p.x = width + p.radius;
          if (p.x > width + p.radius) p.x = -p.radius;
          if (p.y < -p.radius) p.y = height + p.radius;
          if (p.y > height + p.radius) p.y = -p.radius;

          const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.radius);
          grad.addColorStop(0, p.color);
          grad.addColorStop(1, 'rgba(226, 237, 250, 0)');

          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
          ctx.fill();
        }

        requestAnimationFrame(animate);
      }

      animate();
    })();
  </script>
